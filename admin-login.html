<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PKB Admin Login</title><style>body{font-family:system-ui;margin:0;background:#fff7ed;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:28px;border-radius:18px;box-shadow:0 12px 35px #0002;width:min(380px,86vw)}input,button{width:100%;padding:14px;margin-top:12px;border-radius:10px;border:1px solid #ccc;font-size:16px}button{background:#111;color:white;border:0;font-weight:700}.err{color:#b00020}</style></head><body><div class="box"><h2>🔐 Pithapuram Kunda Biryani</h2><p>Admin Dashboard</p><input id="p" type="password" placeholder="Admin password"><button onclick="login()">LOGIN</button><div id="e" class="err"></div></div><script>async function login(){e.textContent='';let r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p.value})});if(r.ok)location='/admin';else e.textContent='Wrong password.'}</script></body></html>
