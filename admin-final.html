<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PKB Admin</title><style>body{font-family:system-ui;margin:0;background:#faf7f0;color:#211a12}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}button{padding:10px 14px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:700}input{padding:10px;border:1px solid #ccc;border-radius:8px}.card{background:white;margin-top:16px;padding:16px;border-radius:14px;box-shadow:0 4px 18px #0001}.row{border-top:1px solid #eee;padding:14px 0}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eee;font-size:12px}</style></head><body><div class="wrap"><div class="top"><div><h1>📋 Bookings</h1><p>Restaurant admin dashboard</p></div><div><input id="d" type="date"><button onclick="load()">Refresh</button><button onclick="logout()">Logout</button></div></div><div id="out" class="card">Loading…</div></div><script>const d=document.getElementById('d');d.value=new Date().toLocaleDateString('en-CA');async function load(){let r=await fetch('/api/bookings?date='+d.value);if(r.status===401){location='/admin-login.html';return}let x=await r.json();out.innerHTML=x.bookings.length?x.bookings.map(b=>`<div class="row"><b>${b.time}</b> <span class="pill">${b.id}</span><br><strong>${esc(b.item_name)} × ${b.qty}</strong><br>Customer: ${esc(b.name)} · ${esc(b.phone)}<br><small>Booked: ${new Date(b.created_at).toLocaleString()}</small></div>`).join(''):'No bookings for this date.'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location='/admin-login.html'}d.onchange=load;load();setInterval(load,15000)</script></body></html>
